# Configuração do publicador de Reels (@content_central_official).
# Segredos (tokens, chaves) NÃO vão aqui: ficam no .env (local) ou nos
# GitHub repo secrets (cloud).

[schedule]
timezone = "Europe/Lisbon"
# Um reel por janela (hora de Lisboa), a uma hora aleatória que muda todos os dias.
# Se mudares as janelas, confirma que os "cron" em .github/workflows/publish.yml
# as cobrem (o README explica como).
windows = [["12:00", "15:00"], ["19:00", "23:00"]]
# Primeiro dia: só a última janela (1 vídeo). Antes deste dia não publica.
start_date = "2026-10-09"
# Semente das horas aleatórias (mudá-la baralha todas as horas futuras).
slot_seed = "content_central"
# Segurança: intervalo mínimo entre reels (qualquer reel da conta, manual ou do bot).
min_hours_between_posts = 3

[queue]
# Publicar primeiro estes números, por esta ordem; o resto segue a numeração.
publish_first = [1, 16]

[source]
# Pasta onde vais juntando vídeos, capas e legendas.
dir = "D:/Content Central"
videos_subdir = "Videos"
covers_subdir = "Covers"
captions_file = "Descriptions.txt"

[instagram]
username = "content_central_official"
graph_api_version = "v23.0"
poll_interval_s = 15
poll_timeout_s = 900

[story]
# Depois de cada reel publica uma story com os primeiros N segundos do vídeo
# (gerada localmente no `import`; a API limita stories de vídeo a 60 s).
teaser_seconds = 15
# Espera máxima pelo processamento da story (curta, para caber no timeout do job).
poll_timeout_s = 300

[bucket]
queue_prefix = "queue/"
state_key = "state/state.json"
token_key = "state/token.json"
presign_ttl_s = 7200

[safety]
max_consecutive_failures = 2
# Renova o token de utilizador quando faltarem menos de N dias.
token_refresh_days = 10
log_keep_days = 30
