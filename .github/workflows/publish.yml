# Publica 1 reel (+ story teaser) por noite às 21:00 de Lisboa.
#
# Poupança de minutos do GitHub Actions:
#  - Só um disparo por dia, excepto nas 2 semanas de mudança de hora (14 dias/ano),
#    em que há dois disparos e o primeiro passo descarta o errado em ~5 s.
#  - Sem gatilhos de push/PR: commits neste repositório não gastam minutos.
#  - Quando a fila acaba ou o bot entra em pausa, o workflow desactiva-se sozinho
#    (0 minutos até o reactivares).
#  - timeout-minutes limita o pior caso: reel 15 min + story 5 min + verificações.
#
# Os cron são em UTC. Lisboa = UTC+0 no inverno e UTC+1 no verão.
# Se mudares publish_time no config.toml, muda também a hora aqui e em PUBLISH_TIME.
name: publish-reel

on:
  schedule:
    - cron: "0 21 * 1,2,11,12 *"   # inverno: 21:00 UTC = 21:00 Lisboa
    - cron: "0 21 1-24 3 *"        # março antes da mudança de hora
    - cron: "0 20 * 4-9 *"         # verão: 20:00 UTC = 21:00 Lisboa
    - cron: "0 20 1-24 10 *"       # outubro antes da mudança de hora
    - cron: "0 20 25-31 3,10 *"    # semanas da mudança de hora: os dois horários;
    - cron: "0 21 25-31 3,10 *"    # o passo "gate" deixa passar só o certo
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só validar, sem publicar"
        type: boolean
        default: false

concurrency:
  group: publish-reel
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para se desactivar quando a fila acaba ou entra em pausa

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLISH_TIME: "21:00"
    steps:
      - name: Gate (hora certa em Lisboa?)
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Hora UTC a que corresponde PUBLISH_TIME hoje em Lisboa (python3 já vem no runner)
          want=$(python3 -c "
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo as Z
          h, m = map(int, os.environ['PUBLISH_TIME'].split(':'))
          d = datetime.now(Z('Europe/Lisbon')).replace(hour=h, minute=m, second=0, microsecond=0)
          print(d.astimezone(Z('UTC')).hour)")
          got=$(echo "$SCHEDULE" | awk '{print $2}')
          if [ "$want" = "$got" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Disparo das ${got}h UTC não corresponde às $PUBLISH_TIME de Lisboa hoje (${want}h UTC). Nada a fazer."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      # Actions fixadas por SHA (o job tem acesso aos segredos de produção)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        if: steps.gate.outputs.go == 'true'
        run: pip install -q -r requirements.txt

      - name: Publicar
        id: run
        if: steps.gate.outputs.go == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          set +e
          python -m reels_bot publish-next $args
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # 10 = pausa (2 falhas seguidas), 11 = fila vazia → desliga o agendamento
      - name: Desactivar agendamento
        if: steps.run.outputs.rc == '10' || steps.run.outputs.rc == '11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable publish.yml --repo "${{ github.repository }}"
          echo "Workflow desactivado. Para retomar: gh workflow enable publish.yml"

      # Falhas, pausa e fila vazia ficam a vermelho → o GitHub envia-te email automaticamente.
      # (Fila vazia só acontece uma vez: o workflow já ficou desactivado no passo anterior.)
      - name: Resultado
        if: steps.run.outputs.rc != '' && steps.run.outputs.rc != '0'
        env:
          RC: ${{ steps.run.outputs.rc }}
        run: |
          case "$RC" in
            11) echo "::error::Fila vazia: junta vídeos em D:\\new.video.everyday, corre 'update' e 'gh workflow enable publish.yml'" ;;
            10) echo "::error::Bot em PAUSA após falhas seguidas: vê os logs, corrige, corre 'resume' e 'gh workflow enable publish.yml'" ;;
            *)  echo "::error::publish-next terminou com código $RC (ver o passo Publicar)" ;;
          esac
          exit 1
