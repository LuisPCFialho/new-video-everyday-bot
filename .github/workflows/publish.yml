# Publica 2 reels por dia (cada um seguido da sua story teaser), a horas aleatórias
# dentro das janelas do config.toml (hora de Lisboa). No 1.º dia (start_date) só 1.
#
# Como funciona:
#  - O cron dispara de 30 em 30 min só nas horas das janelas (em UTC, cobrindo verão e inverno).
#  - O passo "gate" calcula (sem instalar nada, ~5 s) se há um slot aleatório nesta meia hora;
#    se não houver, o job acaba aí. Se houver, o bot espera até ao minuto exacto e publica.
#  - Repositório público: estes minutos não contam para a quota do GitHub Actions.
#    (Num repositório privado isto gastaria ~700 min/mês — não o tornes privado.)
#  - Sem gatilhos de push/PR. Fila vazia ou pausa → o workflow desactiva-se sozinho.
#
# Janelas actuais: 12:00–15:00 e 19:00–23:00 Lisboa = 11–14 h e 18–22 h UTC no verão,
# 12–15 h e 19–23 h UTC no inverno. Se mudares as janelas, ajusta as horas do cron.
name: publish-reel

on:
  schedule:
    - cron: "13,43 11-15,18-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só validar, sem publicar"
        type: boolean
        default: false

concurrency:
  group: publish-reel
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para se desactivar quando a fila acaba ou entra em pausa

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # espera até 31 min pelo minuto do slot + reel 15 min + story 5 min
    steps:
      # Actions fixadas por SHA (o job tem acesso aos segredos de produção)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Gate (há slot nesta meia hora?)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -m reels_bot.slots

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        if: steps.gate.outputs.go == 'true'
        run: pip install -q -r requirements.txt

      - name: Publicar
        id: run
        if: steps.gate.outputs.go == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          args=""
          if [ "$EVENT" = "schedule" ]; then args="--scheduled"; fi
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          set +e
          python -m reels_bot publish-next $args
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # 10 = pausa (2 falhas seguidas), 11 = fila vazia → desliga o agendamento
      - name: Desactivar agendamento
        if: steps.run.outputs.rc == '10' || steps.run.outputs.rc == '11'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable publish.yml --repo "${{ github.repository }}"
          echo "Workflow desactivado. Para retomar: gh workflow enable publish.yml"

      # Falhas, pausa e fila vazia ficam a vermelho → o GitHub envia-te email automaticamente.
      # (Fila vazia só acontece uma vez: o workflow já ficou desactivado no passo anterior.)
      - name: Resultado
        if: steps.run.outputs.rc != '' && steps.run.outputs.rc != '0'
        env:
          RC: ${{ steps.run.outputs.rc }}
        run: |
          case "$RC" in
            11) echo "::error::Fila vazia: junta vídeos em D:\\Content Central, corre 'update' e 'gh workflow enable publish.yml'" ;;
            10) echo "::error::Bot em PAUSA após falhas seguidas: vê os logs, corrige, corre 'resume' e 'gh workflow enable publish.yml'" ;;
            *)  echo "::error::publish-next terminou com código $RC (ver o passo Publicar)" ;;
          esac
          exit 1
